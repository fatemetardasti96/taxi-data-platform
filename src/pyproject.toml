[project]
name = "taxi-data-platform"
version = "0.1.0"
description = "Taxi data platform batch and streaming ingestion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dbt-duckdb>=1.10.1",
    "duckdb>=1.2.0",
    "geopandas>=1.1.3",
    "pandas>=2.3.3",
    "pyspark>=4.1.2",
    "shapely>=2.1.2",
]

[project.scripts]
batch-ingest = "ingestion.batch.main:main"
weather-ingest = "ingestion.historical_weather.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion"]
